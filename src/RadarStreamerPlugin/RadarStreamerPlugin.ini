; RadarStreamerPlugin settings. Keep this file next to RadarStreamerPlugin.dll.
[Stream]
; Where the PAR scope listens. Use 127.0.0.1 unless the scope runs on another PC.
Host=127.0.0.1
Port=49090

[Velocity]
; Stream VATSIM Velocity fast positions (up to 5 Hz, with velocity vectors).
; This reads vPilot's internal event bus; set to false if a vPilot update breaks it.
FastHook=true

[Diagnostics]
; Post per-minute packet rate statistics to the vPilot debug window (.debug).
RateStats=true
